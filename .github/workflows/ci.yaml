name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure Debug
      run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -G Ninja

    - name: Build Debug
      run: cmake --build build-debug

    - name: Run tests (Debug)
      run: ctest --test-dir build-debug --output-on-failure

    - name: Configure Release
      run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -G Ninja

    - name: Build Release
      run: cmake --build build-release

    - name: Run benchmarks (Release)
      run: build-release/benchmark/TreeOptimizer_Bench --benchmark_min_time=0.01

    - name: Configure Sanitizers
      run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -g" -G Ninja

    - name: Build Sanitizers
      run: cmake --build build-san

    - name: Run tests with sanitizers
      run: ctest --test-dir build-san --output-on-failure